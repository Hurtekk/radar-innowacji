    <path d="M196 306 Q220 294 244 306 Q241 330 220 337 Q199 330 196 306 Z" fill="#6B4A3A" stroke="#3A2416"/>
    <ellipse cx="220" cy="309" rx="12" ry="5" fill="#A07860" stroke="none"/>

