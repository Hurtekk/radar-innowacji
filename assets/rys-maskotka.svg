      <ellipse cx="220" cy="190" rx="8" ry="12"/><ellipse cx="170" cy="190" rx="5" ry="10" transform="rotate(-25 170 190)"/><ellipse cx="270" cy="190" rx="5" ry="10" transform="rotate(25 270 190)"/>
      <ellipse cx="86" cy="266" rx="10" ry="6"/><ellipse cx="92" cy="296" rx="8" ry="5"/><ellipse cx="354" cy="266" rx="10" ry="6"/><ellipse cx="348" cy="296" rx="8" ry="5"/>
