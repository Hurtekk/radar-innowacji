<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600">
  <title>Ryś – maskotka Radaru Innowacji</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B66B"/>
      <stop offset="1" stop-color="#D98F45"/>
    </linearGradient>
    <linearGradient id="furSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C888"/>
      <stop offset="1" stop-color="#E4A25A"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#6FB0FF"/>
      <stop offset=".6" stop-color="#2459C9"/>
      <stop offset="1" stop-color="#16348A"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD6A6" stop-opacity="0"/>
      <stop offset="1" stop-color="#5FD6A6" stop-opacity=".45"/>
    </linearGradient>
    <path id="ear" d="M112 205 C62 160 28 90 34 14 C62 28 104 62 138 122 Z"/>
