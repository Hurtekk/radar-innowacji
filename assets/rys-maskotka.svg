    </g>

    <!-- wąsy -->
    <g fill="none" stroke="#8A6A4F" stroke-width="1.8">
      <path d="M170 340 L104 326"/><path d="M168 350 L100 352"/><path d="M172 360 L110 376"/>
      <path d="M270 340 L336 326"/><path d="M272 350 L340 352"/><path d="M268 360 L330 376"/>
