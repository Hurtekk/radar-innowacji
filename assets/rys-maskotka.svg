    <path d="M220 337 L220 350" fill="none"/>
    <path d="M178 346 Q200 376 220 354 Q240 376 262 346" fill="none" stroke="#3A2416" stroke-width="3"/>
    <path d="M192 356 Q220 404 248 356 Q220 372 192 356 Z" fill="#E8788A" stroke="#3A2416" stroke-width="3"/>
