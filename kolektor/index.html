<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar innowacji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Jasny, nowoczesny interfejs: biel, chłodne tło z delikatnym gradientem, indygo i miętowy akcent, duże zaokrąglenia.
   Układ: szklany pasek u góry, lista kart, szczegóły w panelu wysuwanym z prawej, reszta w menu rozwijanych. */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --ink:#1b2440; --muted:#5d6a8d; --line:#e6eaf4; --soft:#f0f3fb;
  --accent:#4f6bed; --accent-d:#3f57d3; --accent-soft:#eef1ff; --teal:#0f9d8c; --teal-soft:#e2f7f3;
  --amber:#b7740b; --amber-soft:#fff3d9; --rose:#c63d56; --rose-soft:#ffe8ec;
  --shadow:0 1px 2px rgba(27,36,64,.04),0 10px 32px rgba(79,107,237,.08);
  --shadow-lg:0 2px 6px rgba(27,36,64,.06),0 18px 50px rgba(79,107,237,.16);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15.5px/1.6 var(--font);color:var(--ink);background:radial-gradient(900px 520px at 6% -8%,#e3eaff 0,transparent 62%),radial-gradient(760px 440px at 100% 0,#dff6f1 0,transparent 58%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--ink);font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:16.5px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid #9db0ff;outline-offset:2px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)} .small{font-size:14px} .hint{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}

/* pasek górny */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.8);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
.hdr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
@media(max-width:820px){.hdr{grid-template-columns:1fr auto}.hdr .sb{grid-column:1/-1;order:3}}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-size:18px;color:var(--ink)}
.logo b{font-weight:800}
.hright{display:flex;gap:10px;align-items:center}
.btn{background:linear-gradient(135deg,#5b7cfa,#4f6bed);color:#fff;border:0;border-radius:12px;padding:9px 18px;font-weight:700;min-height:40px;box-shadow:0 4px 14px rgba(79,107,237,.28)}
.btn:hover{background:linear-gradient(135deg,#5473f3,#4259dc)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 13px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700}
.linkbtn:hover{text-decoration:underline}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:20px;line-height:1}

/* menu rozwijane */
.dd{position:relative}
.ddp{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;z-index:60}
.ddp.wide{min-width:min(460px,90vw);padding:16px}
.ddi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--ink)}
.ddi:hover{background:var(--soft)}
.ddi small{color:var(--muted);font-weight:500}
.ddi[aria-checked="true"]{background:var(--accent-soft);color:var(--accent-d)}
.ddsep{height:1px;background:var(--line);margin:6px 4px}

/* wyszukiwarka */
.sb{position:relative;width:100%;max-width:620px;justify-self:center}
.sb input[type=text]{width:100%;min-height:46px;padding:10px 18px 10px 48px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);font-size:15.5px}
.sb input[type=text]::placeholder{color:#8591ae}
.sb .sicon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#8591ae;display:flex}
.sdrop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);z-index:70;max-height:min(460px,70vh);overflow:auto;padding:8px;text-align:left}
.sdrop[hidden]{display:none}
.sdrop .grp{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8591ae;padding:10px 12px 4px}
.sopt{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:600}
.sopt:hover,.sopt[aria-selected="true"]{background:var(--accent-soft)}
.sopt small{color:var(--muted);font-weight:500;white-space:nowrap}
.sopt.all{color:var(--accent-d);margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 10px 10px}

/* pasek widoku */
.sub{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 18px}
.seg{display:inline-flex;gap:3px;background:#e9edfa;border-radius:14px;padding:4px}
.seg button{background:transparent;border:0;border-radius:10px;padding:7px 18px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(27,36,64,.1)}
.subr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnt{font-size:14px;color:var(--muted)}
.fsel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.fsel{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:13px;margin-bottom:4px;color:var(--ink)}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;background:#fff;color:var(--ink);border:1px solid #d7deef;border-radius:11px;padding:9px 12px;min-height:42px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:3px solid #cfd8ff;outline-offset:0}
input[type=range]{width:100%;accent-color:var(--accent)}

/* elementy */
.pill{display:inline-block;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-d);border-radius:99px;white-space:nowrap}
.pill.good{background:var(--teal-soft);color:var(--teal)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--rose-soft);color:var(--rose)}
.pill.plain{background:var(--soft);color:var(--muted)} .pill.ai{background:var(--ink);color:#fff}
button.pill{border:0}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--ink)}
.dz{display:inline-block;width:8px;height:8px;border-radius:50%}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.alert{padding:12px 16px;border-radius:14px;background:var(--amber-soft)} .alert.info{background:var(--accent-soft)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:rgba(255,255,255,.6);border:1px dashed #cfd7ec;border-radius:20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.bar{height:8px;background:#e8ecf7;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5b7cfa,#14b8a6);border-radius:99px}
.sample{font-size:12px;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 10px;display:inline-block}
ul.why{margin:8px 0 0;padding-left:20px} ul.why li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:#8591ae;text-transform:uppercase;letter-spacing:.07em}
.tablewrap{overflow-x:auto}
.contact{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0;font-size:14.5px}
.contact dt{color:var(--muted);font-weight:600} .contact dd{margin:0;word-break:break-word;font-weight:600}
.ring{position:relative;display:inline-flex;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}

/* karty */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);color:var(--ink);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#cdd7ff}
.card.on{border-color:var(--accent)}
.card .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font-size:17px}
.card .meta{color:var(--muted);font-size:14px}
.card .cfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.card .cfoot span.t{font-size:13px;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}

/* panel szczegółów */
.scrim{position:fixed;inset:0;background:rgba(27,36,64,.28);backdrop-filter:blur(2px);z-index:60;opacity:0;transition:opacity .25s ease}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:#fff;z-index:65;box-shadow:-24px 0 70px rgba(27,36,64,.16);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
@media (prefers-reduced-motion: reduce){.drawer,.scrim{transition:none}}
.dhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:24px 26px 14px}
.dhead h2{font-size:21px;margin:8px 0 4px}
.dhead .meta{color:var(--muted);font-size:14px}
.x{flex:none;background:var(--soft);border:0;border-radius:12px;width:38px;height:38px;font-size:22px;line-height:1;color:var(--muted)}
.x:hover{background:#e3e8f7;color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:0 26px 18px}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 26px;border-top:1px solid var(--line);background:#fbfcff}
.dsum{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:14px 16px;margin:6px 0 10px;flex-wrap:wrap}
.dsum select{min-height:36px;padding:4px 10px;width:auto}
.mini{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:#8591ae;margin:0 0 2px}
.acc{border-top:1px solid var(--line)}
.acch{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:15px 0;font-weight:800;font-size:15px;color:var(--ink)}
.chev{display:inline-block;width:8px;height:8px;border-right:2px solid #8591ae;border-bottom:2px solid #8591ae;transform:rotate(45deg);margin:0 4px 3px 8px;transition:transform .15s}
.acch[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-bottom:-3px}
.accb{padding:0 0 18px}
.sw{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin:0;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.swt{width:40px;height:24px;border-radius:99px;background:#cfd6ea;position:relative;transition:background .15s;flex:none}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+.swt{background:var(--accent)} .sw input:checked+.swt::after{transform:translateX(16px)}
.sw input:focus-visible+.swt{outline:3px solid #9db0ff;outline-offset:2px}
.crit{padding:12px 0;border-top:1px solid var(--line)} .crit:first-child{border-top:0;padding-top:0}
.rec{border-radius:16px;background:var(--accent-soft);padding:16px}
.mrow{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.mrow+.mrow{margin-top:10px}
.labels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{background:var(--soft);border-radius:12px;padding:9px 12px}
.lab .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8591ae;font-weight:800}
.lab .v{font-weight:700;font-size:14px}
pre.card-txt{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,monospace}

/* okno dodawania */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);z-index:85;padding:26px}
.mscrim{z-index:80;opacity:1}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:620px){.form-grid{grid-template-columns:1fr}}
details.dt{border-top:1px solid var(--line)}
details.dt summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary::after{content:"";width:8px;height:8px;border-right:2px solid #8591ae;border-bottom:2px solid #8591ae;transform:rotate(45deg);margin:0 4px 3px 8px;transition:transform .15s}
details.dt[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
details.dt .dtb{padding:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipc{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--soft);padding:6px 14px;font-weight:700;font-size:14px;margin:0;cursor:pointer;color:var(--ink)}
.chipc input{position:absolute;opacity:0;width:0;height:0}
.chipc:has(input:checked){background:var(--accent);color:#fff}
.chipc:has(input:focus-visible){outline:3px solid #9db0ff;outline-offset:2px}

/* strona główna */
.home{max-width:780px;margin:40px auto 0;text-align:center}
.home .kick{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.home h1{font-size:clamp(32px,5.6vw,54px);line-height:1.1;margin:20px 0 16px;letter-spacing:-.025em;font-weight:800}
.home h1 em{font-style:normal;background:linear-gradient(90deg,#4259dc,#0f9d8c);-webkit-background-clip:text;background-clip:text;color:transparent}
.home .lead{color:var(--muted);font-size:18px;max-width:54ch;margin:0 auto 28px}
.home .sb{margin:0 auto;max-width:640px}
.home .sb input[type=text]{min-height:56px;font-size:17px;border-radius:18px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:36px 0 0;text-align:left}
.role{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.role:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.role .ic{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent-d);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.role.t .ic{background:var(--teal-soft);color:var(--teal)}
.role h3{font-size:18px}
.role .go{margin-top:8px;color:var(--accent-d);font-weight:800}
.flow{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:44px 0 0;color:var(--muted);font-weight:700;font-size:14px}
.flow span b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);align-items:center;justify-content:center;margin-right:8px;font-size:12px}
.stats{margin-top:30px;color:#8591ae;font-size:13.5px}

/* mapa */
.mapcard{position:relative;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(#fff,#f3f6ff);box-shadow:var(--shadow)}
#gcv{display:block;width:100%;height:640px;touch-action:none;cursor:grab}
@media(max-width:700px){#gcv{height:480px}}
.gtip{position:absolute;left:16px;bottom:12px;color:#8591ae;font-size:13px;pointer-events:none}
.legend{display:grid;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;vertical-align:middle;margin-right:8px}
.ldot{width:11px;height:11px;border-radius:50%}
.lln{width:28px;height:0;border-top:3px solid}
.back{background:none;border:0;color:var(--accent-d);font-weight:800;padding:22px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.tile .big{font-size:30px;font-weight:800;line-height:1.1}
.hbar{display:grid;grid-template-columns:190px 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:14.5px}
@media(max-width:600px){.hbar{grid-template-columns:110px 1fr 28px}}
.page{max-width:860px;margin:0 auto;padding-bottom:20px}
.page h2{margin:6px 0 16px}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(700px 400px at 20% 10%,#e3eaff,transparent 60%),radial-gradient(600px 380px at 90% 90%,#dff6f1,transparent 60%),#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;transition:opacity .3s ease}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:130px;height:130px;overflow:visible}
#intro .ring2{fill:none;stroke:#4f6bed;stroke-width:2}
#intro .axis{stroke:#4f6bed;stroke-width:1;opacity:.3}
#intro .in{font-weight:800;font-size:30px;text-align:center;color:#1b2440;letter-spacing:-.01em}
#intro .is{color:#5d6a8d;font-size:15px;text-align:center;margin-top:4px}
@media (prefers-reduced-motion: no-preference){
  .sweep{transform-origin:16px 16px;animation:sw 6s linear infinite}@keyframes sw{to{transform:rotate(360deg)}}
  #intro .ring2{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}
  #intro .r2{animation-delay:.12s}#intro .r3{animation-delay:.24s}
  #intro .axis{opacity:0;animation:fade .3s .4s forwards}
  #intro .isweep{transform-origin:60px 60px;transform:rotate(-90deg);opacity:0;animation:spin 1s .45s cubic-bezier(.4,0,.2,1) forwards}
  #intro .blip{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .35s forwards}
  #intro .b1{animation-delay:.85s}#intro .b2{animation-delay:1.1s}
  #intro .iw{opacity:0;transform:translateY(8px);animation:rise .45s .8s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:.3}}
  @keyframes spin{0%{opacity:1;transform:rotate(-90deg)}100%{opacity:1;transform:rotate(270deg)}}
  @keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
  @keyframes rise{to{opacity:1;transform:none}}
}
footer.site{color:#8591ae;padding:26px 0 34px;font-size:13px;text-align:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:120;max-width:92%;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-lg)}

/* swipe */
.swstack{position:relative;width:min(460px,100%);height:min(500px,62vh);min-height:430px;margin:0 auto}
.swc{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow-lg);overflow:auto;touch-action:pan-y;user-select:none}
#swcard{cursor:grab}
.swc.behind{transform:scale(.94) translateY(14px);opacity:.7;pointer-events:none;overflow:hidden}
.stamp{position:absolute;top:18px;font-weight:800;font-size:18px;letter-spacing:.06em;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;pointer-events:none;z-index:2}
.stamp.yes{left:18px;color:var(--teal);border-color:var(--teal);transform:rotate(-10deg)}
.stamp.no{right:18px;color:var(--rose);border-color:var(--rose);transform:rotate(10deg)}
.swbtns{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px}

.swb.undo{width:44px;height:44px;color:var(--muted)} .swb:disabled{opacity:.4;cursor:default}
.swb:hover:not(:disabled){transform:scale(1.06)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:#fff}

.pill.ask{background:#f3e8ff;color:#7e22ce}.alert.dup{background:var(--rose-soft);color:#9f1239;border:1px solid #fecdd3}

.btn .chev,.ddi .chev{margin:0 0 3px 9px}
.dd>button[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-bottom:-3px}
.mapside{position:absolute;top:14px;right:14px;width:290px;max-height:calc(100% - 28px);overflow:auto;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-lg)}
.mapside:empty{display:none}
@media(max-width:700px){.mapside{position:static;width:auto;max-height:none;border-radius:0;border-width:1px 0 0}}
.mrow[style*="block"]{display:block}
.geo{display:flex;height:calc(100vh - 210px);min-height:460px;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);touch-action:none}.geomap{background:radial-gradient(circle at 50% 40%,#d9e9f7,#c4dbef)}
.geomap{position:relative;flex:1;min-width:0}.geo svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}.geo svg:active{cursor:grabbing}
.gwoj{cursor:pointer;transition:fill .15s}.gwoj:hover{fill:#e3ecd3!important}
.gmk{cursor:pointer;outline:none}.gmk:focus-visible circle{stroke:#111827}
.geoctl{position:absolute;left:14px;top:14px;display:grid;gap:6px}

.geoside{width:320px;flex:none;overflow:auto;background:#fff;border-left:1px solid var(--line);padding:16px}

@media(max-width:800px){.geo{display:block;height:auto;min-height:0}.geomap{height:62vh}.geoside{width:auto;border-left:0;border-top:1px solid var(--line)}}
</style>

<body>

<footer class="site"><div class="wrap">Prototyp konkursowy. Projekty pochodzą z publicznej bazy sukcesów NCBR (pobranie jednorazowe), a dodane przez Ciebie dane zostają w Twojej przeglądarce. Nie jest to oficjalny serwis Podkarpackiego Centrum Innowacji.</div></footer>
<script>
//<LOGIC
'use strict';
const STAGES=['Pomysł','Koncepcja','Prototyp','Pilotaż','Wdrożona'];
const TYPES=['technologiczna','organizacyjna','edukacyjna','społeczna','procesowa'];
const INST=['Szkoła','Uczelnia','Samorząd (JST)','Inna instytucja publiczna','Instytut badawczy'];
const SCOPE=['Jedna jednostka','Kilka jednostek','Gmina / powiat','Województwo','Cały kraj'];
const INFRA=['Brak','Niska','Średnia','Wysoka'];
const INFRA_VAL=[5,4,3,2];
const TEAM=['Jedna osoba','Zespół','Zespół z partnerem'];
const IPL=['Brak / nie dotyczy','Zgłoszenie lub ochrona w toku','Patent / prawo ochronne'];
const STATUS=['Zidentyfikowana','Oceniona','Skierowana','W kontakcie','Wdrożona / przekazana'];
const DZ=['Edukacja','Zdrowie i opieka','Lotnictwo i kosmos','Motoryzacja i transport','ICT i dane','Energia i środowisko','Administracja i usługi publiczne','Rozwój społeczny'];
const TAG2DZ={'lotnictwo':'Lotnictwo i kosmos','kosmos':'Lotnictwo i kosmos','motoryzacja':'Motoryzacja i transport','ICT':'ICT i dane','AI':'ICT i dane','IoT':'ICT i dane','czujniki':'ICT i dane','zdrowie':'Zdrowie i opieka','edukacja':'Edukacja','energia':'Energia i środowisko','środowisko':'Energia i środowisko','powietrze':'Energia i środowisko','administracja':'Administracja i usługi publiczne','bezpieczeństwo':'Administracja i usługi publiczne','jakość życia':'Rozwój społeczny','seniorzy':'Rozwój społeczny'};
const TAGW={ICT:.3,AI:.3,IoT:.3,czujniki:.3};
const CITIES=['Rzeszów','Krosno','Przemyśl','Sanok','Mielec','Stalowa Wola','Jasło','Tarnobrzeg','Dębica','Łańcut','Ustrzyki Dolne','Leżajsk','Kolbuszowa','Kraków','Lublin','Warszawa'];
const CRIT=[
 {k:'nov',name:'Nowość i unikalność',w:25,r:['1: istnieje niemal identyczne rozwiązanie','3: znane podejście z istotną modyfikacją','5: brak podobnych rozwiązań w przeszukanych źródłach'],auto:'z podobieństwa do innych rozwiązań'},
 {k:'skala',name:'Skala problemu i wpływ',w:25,r:['1: dotyczy jednej jednostki','3: dotyczy gminy lub powiatu','5: problem ogólnopolski'],auto:'z zasięgu problemu z formularza'},
 {k:'dojr',name:'Dojrzałość rozwiązania',w:20,r:['1: sam pomysł','3: działający prototyp','5: wdrożone i sprawdzone w praktyce'],auto:'z etapu rozwoju'},
 {k:'transfer',name:'Łatwość przeniesienia',w:20,r:['1: wymaga rozbudowanej infrastruktury','3: wymaga dostosowania','5: da się skopiować bez dodatkowych kosztów'],auto:'z wymagań infrastrukturalnych i dokumentacji'},
 {k:'gotow',name:'Gotowość zespołu i ochrona',w:10,r:['1: jedna osoba, brak ochrony','3: zespół, plan rozwoju','5: zespół z partnerem i ochroną własności'],auto:'z zespołu i ochrony własności'}
];
const STOP=new Set('oraz jest sie dla przy jako nie ale lub aby tym ten ta to na do w z i o od po przez ktory ktora ktore ktorych moze moga sa byc jego jej ich tez juz bardzo wiec czy'.split(' '));
function norm(s){return String(s||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'')}
function toks(s){return norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,5))}
function docText(x){return [x.title,x.title,x.problem,x.description,(x.tags||[]).join(' ')].join(' ')}

const REF=[];
function buildSim(inn,all){
  const docs=REF.map(r=>({id:r.id,src:r.src,title:r.title,ref:true,t:toks(docText(r))}))
    .concat(all.filter(x=>x.id!==inn.id).map(x=>({id:x.id,src:'Baza radaru ('+x.institution+')',title:x.title,ref:false,t:toks(docText(x))})));
  const me=toks(docText(inn));
  const N=docs.length+1, df={};
  [me].concat(docs.map(d=>d.t)).forEach(t=>new Set(t).forEach(w=>df[w]=(df[w]||0)+1));
  const vec=t=>{const v={};t.forEach(w=>v[w]=(v[w]||0)+1);Object.keys(v).forEach(w=>v[w]*=Math.log((N+1)/(df[w]+1))+1);return v};
  const cos=(a,b)=>{let d=0,na=0,nb=0;for(const w in a){na+=a[w]*a[w];if(b[w])d+=a[w]*b[w]}for(const w in b)nb+=b[w]*b[w];return na&&nb?d/Math.sqrt(na*nb):0};
  const v0=vec(me);
  return docs.map(d=>({id:d.id,src:d.src,title:d.title,ref:d.ref,sim:cos(v0,vec(d.t))})).sort((a,b)=>b.sim-a.sim);
}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function maxSim(sims){return sims.length?sims[0].sim:0}
function suggest(inn,sims){
  const s=maxSim(sims);
  return {nov:(()=>{const a=clamp(Math.round(5-s*9),1,5);return inn.novelty>=0?clamp(Math.round((a+[5,4,3,2][inn.novelty])/2),1,5):a})(),skala:inn.scope+1,dojr:inn.stage+1,
    transfer:clamp(INFRA_VAL[inn.infra]+(inn.hasDocs?0:-1),1,5),gotow:clamp([2,3,4][inn.team]+(inn.ip>0?1:0),1,5)};
}
function totalScore(sc){return Math.round(CRIT.reduce((a,c)=>a+c.w*(sc[c.k]||1)/5,0))}
function completeness(inn){
  const checks=[inn.title&&inn.title.length>5,(inn.description||'').length>=60,(inn.problem||'').length>=25,!!inn.creators,(inn.tags||[]).length>=2,!!inn.institution,!!inn.contact&&!!inn.phone,inn.hasDocs,inn.ip>0||inn.stage>=2];
  return Math.round(100*checks.filter(Boolean).length/checks.length);
}
function recommend(inn,score,sims,comp){
  const tech=inn.type==='technologiczna', top=sims[0], res={primary:null,secondary:[],alerts:[]};
  if(top&&top.sim>=0.35)res.alerts.push({lvl:'warn',txt:'Możliwe dublowanie prac: „'+top.title+'” ('+top.src+', podobieństwo '+Math.round(top.sim*100)+'%). Przed dalszymi inwestycjami warto skontaktować się z autorami i rozważyć wspólny rozwój.'});
  else if(top&&top.sim>=0.2)res.alerts.push({lvl:'info',txt:'Znaleziono częściowo podobne rozwiązanie: „'+top.title+'” ('+top.src+', '+Math.round(top.sim*100)+'%). Sprawdź, czym Twoje podejście się różni.'});
  const why=[];
  if(comp<60){
    why.push('Kompletność opisu to '+comp+'%, a ocena potencjału wymaga co najmniej 60%.');
    why.push('Brakujące informacje (opis, kontakt, tagi, dokumentacja) ograniczają wiarygodność oceny.');
    res.primary={key:'dane',title:'Uzupełnić dane i obserwować',why};
  }else if(score<45){
    why.push('Ocena '+score+'/100 jest poniżej progu 45.');
    if(inn.stage<=1)why.push('Rozwiązanie jest na etapie pomysłu, więc brakuje dowodów skuteczności.');
    res.primary={key:'obserwuj',title:'Obserwować i doprecyzować pomysł',why};
    res.secondary.push({title:'Konsultacja z mentorem PCI',why:['Mentor pomoże sprawdzić potrzebę i zaplanować pierwszy test.']});
  }else if(inn.stage<=1){
    why.push('Etap „'+STAGES[inn.stage]+'” wymaga potwierdzenia pomysłu w praktyce.');
    why.push('Ocena '+score+'/100 uzasadnia inwestycję w prototyp.');
    res.primary={key:'rozwoj',title:'Rozwinąć: prototypowanie i mentoring',why};
    res.secondary.push({title:'Finansowanie pierwszego testu',why:['Mały grant lub budżet obywatelski wystarczą na prototyp.']});
  }else if(tech&&inn.stage>=2&&score>=55){
    why.push('Innowacja technologiczna na etapie „'+STAGES[inn.stage]+'” z oceną '+score+'/100.');
    if(inn.ip>0)why.push('Ochrona własności jest w toku lub uzyskana, co ułatwia licencjonowanie.');
    else why.push('Brak ochrony własności. Zalecana konsultacja w biurze transferu technologii przed publikacją.');
    res.primary={key:'komerc',title:'Komercjalizacja: licencja, spin-off lub akceleracja',why};
    res.secondary.push({title:'Finansowanie B+R i wdrożenia',why:['Programy typu NCBR wspierają dojrzewanie technologii od prototypu do wdrożenia.']});
  }else if(inn.stage>=3&&(!tech||INFRA_VAL[inn.infra]>=4)){
    why.push('Rozwiązanie działa w praktyce (etap „'+STAGES[inn.stage]+'”) i ma niskie wymagania infrastrukturalne.');
    why.push('Typ „'+inn.type+'” zwykle przenosi się przez replikację wzorca, nie licencję.');
    res.primary={key:'transfer',title:'Transfer i replikacja w innych instytucjach',why};
    res.secondary.push({title:'Wymiana dobrych praktyk i finansowanie',why:['Programy typu Interreg wspierają upowszechnianie sprawdzonych rozwiązań.']});
  }else{
    why.push('Ocena '+score+'/100 przy etapie „'+STAGES[inn.stage]+'” wskazuje na potrzebę dalszego rozwoju.');
    res.primary={key:'rozwoj',title:'Rozwinąć: pilotaż i finansowanie',why};
    res.secondary.push({title:'Poszukać partnera wdrożeniowego',why:['Partner z branży przyspieszy przejście od prototypu do wdrożenia.']});
  }
  if(top&&top.sim>=0.35)res.secondary.unshift({title:'Współpraca zamiast dublowania',why:['Podobne rozwiązanie już istnieje, więc wspólny rozwój obniży koszt i ryzyko.']});
  return res;
}
/* baza inwestorów (uzupełniana z rejestru) */
const PARTNERS=[];
/* siła powiązania innowacja - inwestor: 40% wspólne obszary, 20% typ, 20% etap, 20% ocena potencjału */
function matchScore(inn,prof,score){
  const tags=inn.tags||[],ov=tags.filter(t=>prof.tags.includes(t));
  const tagS=prof.tags.length?Math.min(1,ov.length/Math.min(3,Math.max(1,tags.length))):.5;
  const typeS=prof.types.length?(prof.types.includes(inn.type)?1:0):.5;
  const stS=inn.stage>=prof.st[0]&&inn.stage<=prof.st[1]?1:0;
  const sc=Math.round(100*(.4*tagS+.2*typeS+.2*stS+.2*score/100));
  const why=[];
  if(ov.length)why.push('wspólne obszary: '+ov.join(', '));
  if(typeS===1&&prof.types.length)why.push('przyjmuje innowacje typu „'+inn.type+'”');
  if(stS)why.push('etap „'+STAGES[inn.stage]+'” mieści się w zakresie');
  why.push('ocena potencjału '+score+'/100');
  return {sc,why,ov};
}
const strengthOf=s=>s>=70?'silne':s>=50?'średnie':s>=30?'słabe':'brak';
function matchesFor(inn,score){
  return PARTNERS.map(p=>Object.assign({p},matchScore(inn,{tags:p.tags,types:p.types,st:p.st},score))).filter(m=>m.sc>=30).sort((a,b)=>b.sc-a.sc).slice(0,5);
}
const VOCAB={
 'lotnictwo':['lotni','turbin','silnik lot','samolot'],'motoryzacja':['motoryz','pojazd','samochod'],'kosmos':['kosmi','satelit'],
 'ICT':['aplikac','oprogram','platform','internet','cyfrow','elektronicz'],'AI':['uczenie maszyn','sztuczn','algorytm','analiz obraz','wizj','rozpoznaw'],
 'czujniki':['czujnik','sensor','pomiar'],'IoT':['iot','internet rzeczy'],'zdrowie':['zdrow','rehabilit','pacjent','medyc'],
 'edukacja':['szkol','uczni','nauczyc','lekcj','dydakt','edukac'],'energia':['energi','fotowolt','pv '],'środowisko':['srodowisk','odpad','klimat','ekolog'],
 'powietrze':['powietrz','pyl','co2','smog'],'seniorzy':['senior','starsz','osob starszych'],'administracja':['urzad','gmin','mieszkan','wniosek','bip'],
 'jakość życia':['jakosc zycia','spolecz','mieszkan','wspolnot'],'bezpieczeństwo':['bezpiecz','awari']
};
const ALLTAGS=Object.keys(VOCAB);
function ruleDomain(tags){const c={};(tags||[]).forEach(t=>{const d=TAG2DZ[t];if(d)c[d]=(c[d]||0)+(TAGW[t]||1)});const k=Object.keys(c).sort((a,b)=>c[b]-c[a]);return k[0]||'Rozwój społeczny'}
function domainsOf(tags){return [...new Set((tags||[]).map(t=>TAG2DZ[t]).filter(Boolean))]}
function ruleCity(text){const n=norm(text);for(const c of CITIES){const re=new RegExp('\\b'+norm(c).split(' ').map(w=>w.slice(0,Math.max(4,w.length-2))).join('\\s+'));if(re.test(n))return c}return ''}
function ruleIssuer(name){const n=norm(name);return /szkol|liceum|technikum|przedszkol/.test(n)?0:/uczeln|uniwersytet|politechn|akadem|wydzial/.test(n)?1:/gmin|urzad|starost|miast|powiat/.test(n)?2:/instytut|laborator/.test(n)?4:3}
function ruleTopic(inn){return String(inn.title||'').replace(/\s+/g,' ').split(' ').slice(0,6).join(' ').toLowerCase()}
function deployOf(sc){const r=((sc.transfer||1)+(sc.dojr||1))/2;return r>=4?'Gotowe do wdrożenia':r>=2.5?'Wymaga pilotażu':'Wymaga rozwoju'}
/* etykiety filtrów: nadane przez AI (jeśli dostępne), w przeciwnym razie przez reguły słownikowe */
function labelsOf(inn){
  const ai=inn.ai||{};
  const txt=[inn.institution,inn.title,inn.description].join(' ');
  return {
    dz:DZ.includes(ai.dz)?ai.dz:ruleDomain(inn.tags),
    city:(inn.city||'').trim()||(ai.city||'').trim()||ruleCity(txt)||'Nieokreślone',
    iss:inn.instType>=0?INST[inn.instType]:(INST.includes(ai.issuer)?ai.issuer:INST[ruleIssuer(inn.institution)]),
    topic:(ai.topic||'').trim()||ruleTopic(inn),
    dep:deployOf(inn.scores||{}),
    src:(ai.dz||ai.topic)?'AI':'Reguły'
  };
}
function stemq(q){return norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>=2).map(w=>w.slice(0,5))}
function hay(s){return norm(s).split(/[^a-z0-9]+/).filter(Boolean).map(w=>w.slice(0,5))}
function searchRank(qt,fields){
  if(!qt.length)return 1;
  let tot=0;
  for(const q of qt){let best=0;for(const f of fields){if(f.w>best&&hay(f.text).some(t=>t.startsWith(q)))best=f.w}if(!best)return 0;tot+=best}
  return tot;
}
function maskEmail(e){if(!e)return '—';const p=String(e).split('@');return (p[0]||'').slice(0,1)+'•••@'+(p[1]||'')}
function maskPhone(p){if(!p)return '—';const s=String(p);return s.slice(0,Math.max(0,s.length-5)).replace(/\d/g,'•')+s.slice(-5)}
function extract(text){
  const n=norm(text), out={};
  const sc={technologiczna:0,organizacyjna:0,edukacyjna:0,społeczna:0,procesowa:0};
  const kw={technologiczna:['czujn','algor','urzadz','aplik','senso','oprog','uklad','modul','kamer','prototyp'],organizacyjna:['organiz','struktur','wspolprac','koopera','model','zarzad'],edukacyjna:['uczn','nauczy','szkol','lekcj','ocen','dydakt','edukac'],społeczna:['senior','mieszkan','wspolnot','wolontar','spolecz','integrac'],procesowa:['proces','wniosek','procedur','zgloszen','elektroniczn','rejestr','obieg']};
  for(const t in kw)kw[t].forEach(k=>{sc[t]+=n.split(k).length-1});
  out.type=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0]; if(!sc[out.type])out.type='technologiczna';
  out.stage=/wdrozon|funkcjonuje|dziala od|od \d+ lat/.test(n)?4:/pilota|testow/.test(n)?3:/prototyp/.test(n)?2:/koncepcj|wstepn/.test(n)?1:/pomysl|planuj/.test(n)?0:1;
  out.tags=Object.keys(VOCAB).filter(t=>VOCAB[t].some(k=>n.includes(k))).slice(0,6);
  const m=String(text).match(/(?:Szkoł[aąy]|Liceum|Technikum|Politechnik[aiąę]|Uniwersytet|Uczelni[aąi]|Urząd|Gmin[aąy]|Starostwo|Miasto)(?:\s+(?:nr\s*\d+|im\.|[A-ZŁŚŻŹĆ][\p{L}-]+)){0,3}/u);
  out.institution=m?m[0].trim():'';
  out.instType=out.institution?ruleIssuer(out.institution):-1;
  out.city=ruleCity(text);
  out.title=String(text).split(/[.\n]/)[0].trim().slice(0,110);
  return out;
}
//</LOGIC

/* ---------- rozszerzenia: rodzaj, nowość, kategorie (max 3), środowisko powstania, korzyści ---------- */

/* lokalizacja obiektu: dokładna miejscowość albo samo województwo (wtedy pozycja przybliżona) */
function mkLoc(city,woj,seedStr){
  const p=PLACES[city];
  if(p)return {woj:p[0],powiat:p[1],gmina:p[2],mtyp:p[3],miejsc:city,lat:p[4],lon:p[5],prec:'miejscowość'};
  const c=WOJC[woj];if(!c)return null;
  let h=0;String(seedStr||city||woj).split('').forEach(ch=>h=(h*31+ch.charCodeAt(0))>>>0);
  const a=(h%628)/100,r=.12+((h>>>5)%100)/100*.38;
  return {woj,powiat:'',gmina:'',mtyp:'',miejsc:city||'',lat:c[0]+Math.sin(a)*r*.7,lon:c[1]+Math.cos(a)*r,prec:'województwo'};
}
function locOf(x){
  if(x.loc&&x.loc.woj)return x.loc;
  const c=x.city&&PLACES[x.city]?x.city:'';
  const l=c?mkLoc(c,'',x.id):null;return l;
}

const _num=s=>{const m=String(s).match(/^([\d\s]+),?(\d{0,2})/);return m?parseFloat(m[1].replace(/\s/g,'')+'.'+(m[2]||'0')):0};
function _catsFor(area,title,benef){
  const a=norm(area+' '+title+' '+benef),c=[];
  const add=x=>{if(!c.includes(x))c.push(x)};
  if(/pedagog|edukac|uczni|nauczyc|kurs|uczelni|szkol|akademi|studen/.test(a)&&!/^[^|]*inzynieria/.test(norm(area)))add('Edukacja');
  if(/medyc|covid|szpital|zdrow|pacjent|chorob|niewydolnosc|rany|osluchow|niepłodnosci|niepłodn|bioimpl|protez/.test(a))add('Zdrowie');
  if(/lotni|silnik lot|bomb lotni|lotow/.test(a))add('Lotnictwo');
  if(/pojazd|automotive|motoryz|wagon|skrzyni|samochod|transport/.test(a))add('Motoryzacja');
  if(/energi|recykl|srodowisk|ekolog|ogniw|paliw|odpad|morz|woda|wodn|spalin|powodz|co2|oleje|olejow/.test(a))add('Energia i środowisko');
  if(/obron|bezpieczen|straz|rakiet|dron|radar|laser|cyber|pocisk|bomb/.test(a))add('Bezpieczeństwo');
  if(/rolnic|lesnictw|ryb|owoc|pszenz|hodowl|zgrabiar/.test(a))add('Rolnictwo i żywność');
  if(/komputer|informatyk|elektronik|elektrotech|oprogram|aplikac|cloud|python|javascript|ict|vr |wirtualn|sensor|czujnik|swiatlowod|robot|druk|rgb|dzwiek|spektrometr|cyber/.test(a))add('Technologia');
  if(/ uis? |sztuczn|algorytm|uczenie maszyn|klasyfikacj/.test(a))add('AI');
  if(!c.length)add('Technologia');
  return c.slice(0,3);
}
const _fin=s=>{const m=String(s).match(/^\d{2}\.\d{2}\.(\d{4})–(\d{2}\.\d{2}\.(\d{4}))/);return m?+m[3]:(String(s).match(/(\d{4})\s*$/)||[])[1]|0};

function filterInn(items){

  return items.map(i=>{const a=analyze(i),l=a.lab;

function filterInv(list){

  return list.map(p=>{const dzs=domainsOf(p.tags);

}

let GR=null;
function stopGraph(){if(GR){cancelAnimationFrame&&cancelAnimationFrame(GR.raf);GR.dead=true;GR=null}}
function graphPairs(){
  const items=vis(),invs=allInvestors(),pairs=[];
  items.forEach(i=>{const a=analyze(i);invs.forEach(p=>{const m=matchScore(i,{tags:p.tags,types:p.types,st:p.st},a.score);pairs.push({i,p,sc:m.sc,why:m.why})})});
  return pairs;
}
function buildGraphData(prev){
  const nodes=[],edges=[],byId={};
  const add=n=>{const o=prev&&prev[n.id];n.x=o?o.x:(Math.random()-.5)*300;n.y=o?o.y:(Math.random()-.5)*300;n.vx=0;n.vy=0;byId[n.id]=n;nodes.push(n);return n};
  const items=vis(),invs=allInvestors();
  [...new Set(items.map(i=>i.institution))].forEach(o=>add({id:'o:'+o,type:'org',label:o,r:12}));
  items.forEach(i=>{add({id:'i:'+i.id,type:'inn',label:i.title,r:8,ref:i});edges.push({a:'o:'+i.institution,b:'i:'+i.id,kind:'own',w:100})});
  invs.forEach(p=>add({id:'p:'+p.id,type:p.id==='me'?'me':'inv',label:p.name,r:p.id==='me'?11:8,ref:p}));
  if(S.gtopics){
    const used=new Set();items.forEach(i=>used.add(analyze(i).lab.dz));invs.forEach(p=>domainsOf(p.tags).forEach(d=>used.add(d)));
    used.forEach(d=>add({id:'t:'+d,type:'topic',label:d,r:6}));
    items.forEach(i=>edges.push({a:'i:'+i.id,b:'t:'+analyze(i).lab.dz,kind:'topic',w:100}));
    invs.forEach(p=>domainsOf(p.tags).forEach(d=>edges.push({a:'p:'+p.id,b:'t:'+d,kind:'topic',w:100})));
  }
  graphPairs().forEach(x=>{if(x.sc>=S.gmin)edges.push({a:'i:'+x.i.id,b:'p:'+x.p.id,kind:'match',w:x.sc,why:x.why})});
  edges.forEach(e=>{e.A=byId[e.a];e.B=byId[e.b]});
  return {nodes,edges,byId};
}

function graphSide(n){
  if(!n)return '';
  const links=GR.data.edges.filter(e=>e.kind==='match'&&(e.A===n||e.B===n)).sort((a,b)=>b.w-a.w);
  const other=e=>e.A===n?e.B:e.A;

  if(n.type==='org'){const inns=vis().filter(i=>i.institution===n.label);

  const rel=GR.data.edges.filter(e=>e.kind==='topic'&&(e.A===n||e.B===n)).map(other);
  return x+'<span class="pill plain">temat</span><h3 style="margin:8px 0 4px">'+esc(n.label)+'</h3><p class="small muted">Łączy '+rel.length+' kropek.</p><div style="max-height:200px;overflow:auto">'+rel.map(r=>'<button class="ddi" style="padding:6px 8px" data-gnode="'+esc(r.id)+'">'+esc(r.label)+'</button>').join('')+'</div>';

function initGraph(){
  const cv=$('gcv');if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const G=GR={cv,ctx,raf:0,dead:false,k:1,tx:0,ty:0,w:0,h:0,alpha:1,hover:null,sel:null,drag:null,pan:null,moved:false,data:null};
  G.data=buildGraphData();
  const defSel=S.role==='inv'?'p:me':null;
  G.sel=G.data.byId[S.gsel]?S.gsel:(G.data.byId[defSel]?defSel:null);
  function resize(){const r=cv.getBoundingClientRect();G.w=r.width;G.h=r.height;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);G.tx=G.w/2;G.ty=G.h/2}
  resize();
  const side=()=>{const s=$('gside');if(s)s.innerHTML=graphSide(G.sel?G.data.byId[G.sel]:null)};
  G.side=side;side();
  G.rebuild=()=>{const prev={};G.data.nodes.forEach(n=>prev[n.id]={x:n.x,y:n.y});G.data=buildGraphData(prev);if(!G.data.byId[G.sel])G.sel=null;G.alpha=.8;side()};
  G.reset=()=>{G.data.nodes.forEach(n=>{n.x=(Math.random()-.5)*300;n.y=(Math.random()-.5)*300;n.vx=n.vy=0});G.alpha=1;G.k=1;G.tx=G.w/2;G.ty=G.h/2};
  G.select=id=>{G.sel=id||null;S.gsel=G.sel;side()};
  const neigh=id=>{const s=new Set([id]);G.data.edges.forEach(e=>{if(e.a===id)s.add(e.b);if(e.b===id)s.add(e.a)});return s};
  const COL={org:'#f59e0b',inn:'#4f6bed',inv:'#0f9d8c',me:'#d946ef',topic:'#94a3b8'};
  function tick(){
    const N=G.data.nodes,E=G.data.edges,a=G.alpha;
    for(let i=0;i<N.length;i++){const p=N[i];for(let j=i+1;j<N.length;j++){const q=N[j];const dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy+.01;if(d2>360000)continue;const d=Math.sqrt(d2),f=7000/d2*a,fx=dx/d*f,fy=dy/d*f;p.vx+=fx;p.vy+=fy;q.vx-=fx;q.vy-=fy}}
    for(const e of E){const p=e.A,q=e.B;if(!p||!q)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;const L=e.kind==='own'?60:e.kind==='topic'?150:360-2.3*e.w;const k=e.kind==='match'?.003+e.w/100*.02:.02;const f=(d-L)*k*a,fx=dx/d*f,fy=dy/d*f;p.vx+=fx;p.vy+=fy;q.vx-=fx;q.vy-=fy}
    for(const p of N){p.vx-=p.x*.0016*a;p.vy-=p.y*.0016*a;if(p.fx!=null){p.x=p.fx;p.y=p.fy;p.vx=p.vy=0}else{p.vx*=.8;p.vy*=.8;p.x+=p.vx;p.y+=p.vy}}
    G.alpha=Math.max(.0,G.alpha*.988);
  }
  function draw(){
    const c=ctx,N=G.data.nodes,E=G.data.edges;
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,G.w,G.h);
    c.save();c.translate(G.tx,G.ty);c.scale(G.k,G.k);
    const focus=G.hover||G.sel,nb=focus?neigh(focus):null;
    for(const e of E){
      if(!e.A||!e.B)continue;
      const on=!focus||(e.a===focus||e.b===focus);
      c.beginPath();c.moveTo(e.A.x,e.A.y);c.lineTo(e.B.x,e.B.y);c.setLineDash([]);
      let col,lw;
      if(e.kind==='match'){if(e.w>=70){col='15,157,140';lw=3.2}else if(e.w>=50){col='79,107,237';lw=2.2}else{col='148,163,184';lw=1.3;c.setLineDash([5/G.k,4/G.k])}c.strokeStyle='rgba('+col+','+(on?(e.w>=70?.9:e.w>=50?.75:.6):.07)+')'}
      else{lw=1;c.strokeStyle='rgba(148,163,184,'+(on?(e.kind==='own'?.5:.28):.07)+')'}
      c.lineWidth=lw/G.k;c.stroke();
    }
    c.setLineDash([]);
    for(const n of N){
      const on=!nb||nb.has(n.id),hot=n.id===G.hover||n.id===G.sel;
      c.globalAlpha=on?1:.2;
      c.beginPath();c.arc(n.x,n.y,n.r*(hot?1.25:1),0,6.2832);c.fillStyle=COL[n.type];
      if(hot){c.shadowColor=COL[n.type];c.shadowBlur=14}
      c.fill();c.shadowBlur=0;
      c.lineWidth=2/G.k;c.strokeStyle='#fff';c.stroke();
      if(n.type==='me'){c.lineWidth=2/G.k;c.strokeStyle='#d946ef';c.beginPath();c.arc(n.x,n.y,n.r+4,0,6.2832);c.stroke()}
      c.globalAlpha=1;
    }
    c.font='600 '+(12/G.k)+'px Manrope, system-ui, sans-serif';c.textAlign='center';
    for(const n of N){
      const on=!nb||nb.has(n.id),hot=n.id===G.hover||n.id===G.sel;
      if(!focus&&!(n.type==='inn'||n.type==='me'||n.type==='org')&&G.k<1.5)continue;
      if(focus&&!on)continue;
      let t=n.label;if(!hot&&t.length>24)t=t.slice(0,23)+'…';
      c.fillStyle=hot?'#1b2440':(on?'rgba(27,36,64,.78)':'rgba(27,36,64,.16)');
      c.fillText(t,n.x,n.y+n.r+14/G.k);
    }
    c.restore();
  }
  function loop(){if(G.dead)return;if(G.alpha>.01||G.drag)tick();draw();G.raf=raf(loop)}
  loop();
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  const toG=p=>({x:(p.x-G.tx)/G.k,y:(p.y-G.ty)/G.k});
  const hit=p=>{const g=toG(p);let b=null;for(const n of G.data.nodes){const d=Math.hypot(n.x-g.x,n.y-g.y);if(d<=n.r+5/G.k)b=n}return b};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pos(e),n=hit(p);G.moved=false;G.start=p;if(n){G.drag=n;const g=toG(p);n.fx=g.x;n.fy=g.y;G.alpha=Math.max(G.alpha,.35)}else G.pan={x:p.x-G.tx,y:p.y-G.ty}});
  cv.addEventListener('pointermove',e=>{const p=pos(e);if(G.start&&Math.hypot(p.x-G.start.x,p.y-G.start.y)>3)G.moved=true;
    if(G.drag){const g=toG(p);G.drag.fx=g.x;G.drag.fy=g.y}else if(G.pan){G.tx=p.x-G.pan.x;G.ty=p.y-G.pan.y}else{const n=hit(p);G.hover=n?n.id:null;cv.style.cursor=n?'pointer':'grab'}});
  cv.addEventListener('pointerup',e=>{if(G.drag){const n=G.drag;n.fx=n.fy=null;if(!G.moved)G.select(n.id);G.drag=null}else if(G.pan){if(!G.moved)G.select(null);G.pan=null}G.start=null});
  cv.addEventListener('pointerleave',()=>{G.hover=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e),g=toG(p),k=clamp(G.k*Math.exp(-e.deltaY*.0012),.4,2.6);G.k=k;G.tx=p.x-g.x*k;G.ty=p.y-g.y*k},{passive:false});
  window.addEventListener('resize',()=>{if(!G.dead)resize()});
}

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

}

const FREEMAIL=/@(gmail|wp|o2|interia|onet|outlook|hotmail|yahoo|op|poczta|tlen|icloud)\./i;
const isInn=x=>x&&x.title!==undefined&&x.stage!==undefined;
const TCACHE=new Map();
function trustOf(x){
  const key=x.id+'|'+((REPS[x.id]||[]).length)+'|'+(x.title||x.name);

  C.push({n:2,t:'Twierdzenia a źródła zewnętrzne',s:x.registry?'ok':(inn&&x.ip>0)?'warn':'na',x:x.registry?'Tytuł, program, budżet i okres pochodzą ze strony projektu w rejestrze NCBR (link w punkcie 3). Autorstwo i patenty sprawdź w bazach poniżej.':(inn&&x.ip>0)?'Zgłoszono ochronę własności. Sprawdź numer zgłoszenia lub patentu w bazie UPRP lub EPO oraz autorstwo w PBN.':'Brak twierdzeń do sprawdzenia w zewnętrznych bazach.',links:[['UPRP','https://ewyszukiwarka.pue.uprp.gov.pl/search/simple-search'],['EPO','https://register.epo.org/regviewer'],['PBN','https://pbn.nauka.gov.pl/core/#/home']]});

  const iss=[];
  if(inn&&x.stage===4&&!x.url)iss.push('Etap „Wdrożona” bez dowodu.');
  if(inn&&x.estimated)iss.push('Etap, skala i gotowość zespołu oszacowano automatycznie z programu i budżetu. Potwierdź z beneficjentem.');
  if(inn){try{const a=analyze(x),s=a.sims&&a.sims[0];if(s&&!s.ref&&s.sim>=.5)iss.push('Możliwy duplikat: „'+s.title+'” ('+Math.round(s.sim*100)+'%).')}catch(e){}}
  if(!l)iss.push('Brak lokalizacji: ogłoszenie nie pojawi się na mapie.');else if(l.prec==='województwo')iss.push('Lokalizacja przybliżona: znane tylko województwo.');
  if(!inn&&x.inferred)iss.push('Oferta wywnioskowana z rejestru. Podmiot nie złożył jej sam.');

  C.push({n:4,t:'Poziom zaufania',s:lvl>=2?'ok':lvl===1?'warn':'no',x:TRUSTN[lvl]+(reps>=3?' (obniżony po zgłoszeniach)':'')+'. Poziom 3 wymaga potwierdzenia przez niezależną osobę, np. nauczyciela, opiekuna lub partnera.'});
  C.push({n:5,t:'Kontrola jakości treści',s:iss.length?'warn':'ok',x:iss.length?iss.join(' '):'Nie wykryto niespójności ani duplikatów.'});

function clipHalf(poly,s,t,diff){

    if(ina&&inb)out.push({p:a.p,fl:a.fl});

}

  const inputs=[['Etap rozwoju',STAGES[inn.stage]],['Zasięg problemu',SCOPE[inn.scope]],['Wymagana infrastruktura',INFRA[inn.infra]],['Dokumentacja',inn.hasDocs?'tak':'nie'],['Zespół',TEAM[inn.team]],['Ochrona własności',IPL[inn.ip]]];
  const pts=CRIT.map(c=>({c,v:sc[c.k]||1,p:c.w*(sc[c.k]||1)/5}));
  const rows=pts.map(x=>'<tr><td>'+x.c.name+'</td><td class="num">'+x.v+'/5</td><td class="num">'+x.c.w+'%</td><td class="num">'+x.p.toFixed(1)+'</td><td class="small muted">'+x.c.auto+'</td></tr>').join('');
  const up=pts.filter(x=>x.v<5).sort((p,q)=>q.c.w-p.c.w).slice(0,2).map(x=>'<li>'+x.c.name+': każdy punkt więcej w skali 1–5 dodaje '+(x.c.w/5).toFixed(0)+' pkt do oceny.</li>').join('');
  const src=inn.estimated?'Etap, zasięg, infrastrukturę i zespół <b>oszacowano automatycznie</b> z programu, budżetu i składu konsorcjum w rejestrze NCBR.':'Dane wejściowe pochodzą z formularza zgłoszenia i mogą być poprawione ręcznie w sekcji „Szczegóły oceny”.';
  const body='<p class="small">'+src+'</p><div class="tablewrap"><table><thead><tr><th>Kryterium</th><th>Wartość</th><th>Waga</th><th>Punkty</th><th>Skąd wartość</th></tr></thead><tbody>'+rows+'<tr><td><b>Suma</b></td><td></td><td class="num">100%</td><td class="num"><b>'+totalScore(sc)+'</b></td><td class="small muted">suma wag × wartość / 5</td></tr></tbody></table></div>'+
   '<p class="small" style="margin-top:10px"><b>Dane wejściowe:</b> '+inputs.map(x=>esc(x[0])+': '+esc(x[1])).join(' · ')+'</p>'+
   '<p class="small"><b>Progi:</b> od 65 wysoki potencjał, 45–64 średni, poniżej 45 niski. <b>Co poprawiłoby wynik:</b></p><ul class="why">'+up+'</ul>'+
   '<p class="small"><b>Rekomendowana ścieżka</b> zależy od kompletności opisu (próg 60%), oceny (próg 45), etapu, typu innowacji, ochrony własności i podobieństwa do innych rozwiązań (ostrzeżenie od 35%). Reguły są jawne i opisane na stronie „Metodologia oceny”.</p>';
  return acc('jak','Jak to policzono','<span class="pill plain">'+totalScore(sc)+'/100</span>',body);
}

function csvParse(t){
  const del=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===del){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows;
}
const csvQ=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const CSV_HEAD=['tytul','opis','problem','instytucja','miejscowosc','wojewodztwo','powiat','gmina','etap','typ','kategorie','link'];
function exportRows(){return vis().map(i=>{const l=locOf(i)||{};return [i.title,i.description,i.problem,i.institution,l.miejsc||i.city,l.woj,l.powiat,l.gmina,STAGES[i.stage],i.type,(i.cats||[]).join('|'),i.url||''].map(csvQ).join(';')})}
function importCsv(text){
  if(!S.acct){S.modal='acct';S.acctMode='login';renderLayer(true);return toast('Import wymaga logowania.')}
  const rows=csvParse(text);if(rows.length<2)return toast('Plik jest pusty lub ma niepoprawny format.');
  const h=rows[0].map(x=>norm(x.trim()));const col=n=>h.indexOf(n);
  let ok=0,bad=0;
  rows.slice(1).forEach(r=>{
    const g=n=>{const i=col(n);return i>=0?(r[i]||'').trim():''};
    const title=g('tytul');if(title.length<5||!g('wojewodztwo')&&!PLACES[g('miejscowosc')]){bad++;return}
    const si=STAGES.findIndex(s=>norm(s)===norm(g('etap')));const st=si>=0?si:Math.min(4,Math.max(0,parseInt(g('etap'))||1));
    const cats=g('kategorie').split('|').map(x=>x.trim()).filter(x=>CATS.includes(x)).slice(0,3);
    const loc=mkLoc(g('miejscowosc'),g('wojewodztwo')||(PLACES[g('miejscowosc')]||[])[0],title);if(!loc){bad++;return}
    if(g('powiat'))loc.powiat=g('powiat');if(g('gmina'))loc.gmina=g('gmina');
    const o=enrich(mk({title,description:g('opis'),problem:g('problem'),institution:g('instytucja')||S.acct.name,instType:S.acct.kind<5?S.acct.kind:3,city:loc.miejsc,loc,stage:st,type:TYPES.includes(g('typ'))?g('typ'):'technologiczna',cats,url:g('link'),contact:S.acct.email,phone:S.acct.phone,creators:S.acct.person,owner:S.acct.email,source:'Import CSV',hasDocs:!!g('link')}));
    if(!o.cats.length)o.cats=catsFromTags(extract(title+' '+o.description).tags).slice(0,3);
    o.tags=tagsFromCats(o.cats);o.scores=suggest(o,buildSim(o,S.items));S.items.unshift(o);ok++;
  });
  save();AC.clear();TCACHE.clear();render();toast('Zaimportowano: '+ok+(bad?', pominięto błędnych wierszy: '+bad:'')+'.');
}

  if(a==='privcopy'){const mine=S.acct?S.items.filter(i=>i.owner===S.acct.email):[];out(JSON.stringify({konto:S.acct?{nazwa:S.acct.name,email:S.acct.email,miasto:S.acct.city}:null,innowacje:mine,zgloszenia:REPS},null,1));return true}

    S.delAsk2=false;

  }

  if(a==='perf'){
    const t0=performance.now(),N=1000,syn=[];
    for(let i=0;i<N;i++){const base=S.items[i%S.items.length];syn.push(Object.assign({},base,{id:'s'+i,title:base.title+' '+i,tags:base.tags.slice()}))}
    const t1=performance.now();const sims=buildSim(syn[0],syn);const t2=performance.now();
    let n=0;syn.forEach(x=>{const sc=totalScore(suggest(x,[]));PARTNERS.forEach(p=>{if(matchScore(x,{tags:p.tags,types:p.types,st:p.st},sc).sc>=30)n++})});const t3=performance.now();

    return true;
  }
  return false;
}

  if(d.go){return go(d.go)}
  if(d.page){return setPage(d.page)}
  if(d.role){S.role=S.acct?acctRole(S.acct):d.role;S.view='inn';S.page=null;S.drawer=null;S.modal=null;S.dd=null;clearFilters();return render()}

  if(d.acctmode){S.acctMode=d.acctmode;return renderLayer(true)}

  if(d.contact&&inn){const p=d.contact,i=inn.contacts.indexOf(p),nm=PARTNERS.find(x=>x.id===p).name;if(i>=0){inn.contacts.splice(i,1);log(inn,'Cofnięto kontakt: '+nm)}else{inn.contacts.push(p);log(inn,'Oznaczono kontakt: '+nm);if(inn.status<3)inn.status=3}save();return after()}
  if(d.reset&&inn){inn.scores[d.reset]=analyze(inn).sug[d.reset];save();return after()}
  if(d.feed!=null){const f=FEED[+d.feed],x=extract(f.text);S.draft={title:x.title,type:x.type,stage:x.stage,tags:x.tags,institution:x.institution,instType:x.instType>=0?x.instType:undefined,city:x.city,description:f.text,problem:''};S.addMode='form';return renderLayer(true)}
  if(d.int){S.openInt=S.openInt===d.int?null:d.int;return renderLayer()}
  if(d.sendint){const x=S.items.find(i=>i.id===d.sendint);if(!x||myInterest(x))return;const m=($('int-msg').value||'').trim();x.interests.push({id:uid(),investor:S.inv.name,msg:m||'Zainteresowanie ofertą.',status:'oczekuje',t:now(),contact:{person:S.inv.person,email:S.inv.email,phone:S.inv.phone}});log(x,'Zapytanie inwestora: '+S.inv.name);S.openInt=null;save();toast('Zapytanie wysłane.');return after()}
  if(d.intact&&inn){const pr=d.intact.split(':'),q=inn.interests.find(x=>x.id===pr[1]);if(q){q.status=pr[0]==='ok'?'zaakceptowane':'odrzucone';log(inn,(pr[0]==='ok'?'Zaakceptowano':'Odrzucono')+' zapytanie: '+q.investor);if(pr[0]==='ok'&&inn.status<3)inn.status=3}save();return after()}
  const act=d.act;
  if(act==='home'){S.role=null;S.page=null;S.drawer=null;S.modal=null;S.dd=null;clearFilters();return render()}
  if(act==='addoffer'){S.modal='offer';S.dd=null;S.drawer=null;S._on=false;renderTop();return renderLayer(true)}
  if(act==='acct'){S.modal='acct';S.dd=null;S.drawer=null;S._on=false;renderTop();return renderLayer(true)}
  if(act==='logout')return logout();
  if(act==='back'){S.page=null;return render()}
  if(act==='add'){S.modal='add';S.draft=S.acct&&S.acct.kind<5?{institution:S.acct.name,instType:S.acct.kind,creators:S.acct.person,contact:S.acct.email,phone:S.acct.phone,city:S.acct.city}:null;S.addMode='form';S.dd=null;S.drawer=null;S._on=false;renderTop();return renderLayer(true)}
  if(act==='closem'){S.modal=null;return renderLayer(true)}
  if(act==='closed'){return closeD()}
  if(act==='clr'){clearFilters();return after()}
  if(act==='aiall'){aiAll();return}
  if(act==='ai'&&inn){toast('AI nadaje etykiety...');aiLabel(inn,true);return}
  if(act==='greset'&&GR){GR.reset();return}
  if(act==='scan'){const x=$('scan-txt').value;S.txt=x;if(x.trim().length<30){toast('Wklej dłuższy opis (co najmniej kilka zdań).');return}const e2=extract(x);S.draft={title:e2.title,type:e2.type,stage:e2.stage,tags:e2.tags,institution:e2.institution,instType:e2.instType>=0?e2.instType:undefined,city:e2.city,description:x,problem:''};S.addMode='form';return renderLayer(true)}
  if(act==='del'){S.delAsk=true;return renderLayer()}
  if(act==='delno'){S.delAsk=false;return renderLayer()}
  if(act==='delok'&&inn){if(S.items.length<2)return;S.items=S.items.filter(x=>x.id!==inn.id);S.sel=S.items[0].id;S.delAsk=false;save();S.drawer=null;S._on=false;toast('Usunięto innowację.');return render()}
  if(act==='route'&&inn){const a=analyze(inn);inn.status=Math.max(inn.status,2);log(inn,'Skierowano: '+a.rec.primary.title);save();toast('Status: Skierowana.');return after()}
  if(act==='card'){S.showCard=!S.showCard;return renderLayer()}
}
const SEL='[data-acctmode],[data-dd],[data-sec],[data-sb],[data-open],[data-view],[data-go],[data-page],[data-role],[data-rmf],[data-addmode],[data-gnode],[data-contact],[data-reset],[data-feed],[data-rid],[data-demo],[data-int],[data-sendint],[data-intact],[data-act]';
document.addEventListener('click',e=>{
  let ch=false;
  if(S.sbOpen&&!e.target.closest('#sb')){S.sbOpen=false;renderDrop()}
  if(S.dd&&!e.target.closest('.dd')){S.dd=null;ch=true}
  const t=e.target.closest(SEL);
  if(!t){if(ch)refreshChrome();return}
  if(t.tagName==='A')return;
  if(ch&&!t.dataset.dd)S.dd=null;
  if(t.disabled)return;
  actionFor(t.dataset,cur());
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='q'){S.q=t.value;S.sbOpen=true;S.sbIdx=-1;renderDrop();if($('res')){updateRes();renderSubEl()}return}
  if(d.slider){const el=$('v-'+d.slider);if(el)el.textContent=t.value}
  if(d.gmin){const el=$('gmin-v');if(el)el.textContent=t.value}
});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&!S.sbOpen){S.sbOpen=true;S.sbIdx=-1;renderDrop()}});
document.addEventListener('keydown',e=>{
  if(e.target.id==='q'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!S.sbOpen){S.sbOpen=true;renderDrop()}const n=S.sbN||1;S.sbIdx=e.key==='ArrowDown'?(S.sbIdx+1)%n:(S.sbIdx<=0?n-1:S.sbIdx-1);renderDrop();const el=$('sopt-'+S.sbIdx);if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();const el=S.sbIdx>=0?$('sopt-'+S.sbIdx):null;if(el&&el.dataset.sb){const p=el.dataset.sb,ix=p.indexOf(':');sbChoose(p.slice(0,ix),p.slice(ix+1))}else sbChoose('all','')}
    else if(e.key==='Escape'){S.sbOpen=false;renderDrop()}
    return;
  }
  if(e.key==='Escape'){
    if(S.dd){S.dd=null;refreshChrome()}
    else if(S.modal){S.modal=null;renderLayer(true)}
    else if(S.drawer)closeD();
  }
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.srcf){if(d.srcf==='kind')S.srcKind=t.value;else S.srcCat=t.value;return render()}
  if(d.cat!=null){const box=t.closest('.chips');if(box&&box.querySelectorAll('input:checked').length>3){t.checked=false;toast('Maksymalnie 3 kategorie.')}return}
  if(d.flt){const p=d.flt.split('.');(p[0]==='f'?S.f:S.fi)[p[1]]=t.value;return after()}
  if(t.id==='fitfor'){S.sel=t.value;return after()}
  if(d.gmin){S.gmin=+t.value;if(GR)GR.rebuild();return}
  if(d.gtopics!=null){S.gtopics=t.checked;if(GR)GR.rebuild();return}
  if(d.statussel!=null){const x=cur();if(!x)return;x.status=+t.value;log(x,'Status: '+STATUS[x.status]);save();return after()}
  if(d.pub!=null){const x=cur();if(!x)return;x.public=t.checked;log(x,x.public?'Udostępniono inwestorom':'Wycofano z widoku inwestorów');save();return after()}
  if(d.pf){const P=S.inv,v=t.value;
    if(d.pf==='tag'||d.pf==='type'){const arr=d.pf==='tag'?P.tags:P.types,ix=arr.indexOf(v);if(t.checked&&ix<0)arr.push(v);if(!t.checked&&ix>=0)arr.splice(ix,1)}
    else if(d.pf==='smin')P.smin=+v;else if(d.pf==='smax')P.smax=+v;else if(d.pf==='min')P.min=+v;else if(d.pf==='dup')P.dup=t.checked;
    else if(['name','person','email','phone','city'].includes(d.pf))P[d.pf]=v.trim()||(d.pf==='name'?'Mój fundusz (demo)':'');
    if(P.smin>P.smax){const z=P.smin;P.smin=P.smax;P.smax=z}
    save();return render()}
  const k=d.slider;if(!k)return;const inn=cur();if(!inn)return;
  inn.scores[k]=+t.value;log(inn,'Zmieniono ocenę: '+CRIT.find(c=>c.k===k).name+' = '+t.value);save();after();const el=document.querySelector('[data-slider="'+k+'"]');if(el&&el.focus)el.focus();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f')return;e.preventDefault();
  const g=id=>$(id).value;
  const cats=[...document.querySelectorAll('#cats input:checked')].map(x=>x.value);
  if(!cats.length||cats.length>3){toast('Wybierz od 1 do 3 kategorii.');return}
  if(!$('f-consent').checked){toast('Potrzebna jest zgoda twórców na przetwarzanie danych.');return}
  const it=+g('f-itype');
  addItem({title:g('f-title').trim(),type:g('f-type'),rodzaj:+g('f-rodzaj'),novelty:+g('f-novel'),origin:+g('f-origin'),cats,benefit:g('f-benefit').trim(),stage:+g('f-stage'),problem:g('f-problem').trim(),description:g('f-desc').trim(),tags:g('f-tags').split(',').map(x=>x.trim()).filter(Boolean),institution:g('f-inst').trim(),instType:it<0?ruleIssuer(g('f-inst')):it,city:g('f-city').trim(),creators:g('f-cr').trim(),contact:g('f-ct').trim(),phone:g('f-ph').trim(),scope:+g('f-scope'),infra:+g('f-infra'),team:+g('f-team'),ip:+g('f-ip'),hasDocs:$('f-docs').checked},S.draft&&S.draft.description?'Skaner źródeł':'Zgłoszenie ręczne');
});
render();
(function(){
  const el=$('intro');if(!el)return;
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let done=false;
  function close(){if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),320)}
  el.addEventListener('click',close);
  setTimeout(close,calm?700:2000);
})();

/* codzienny kanał z kolektora: po wdrożeniu na serwer strona dociąga feed/feed.json; w podglądzie bez serwera działa wbudowana migawka */
function loadFeed(){
  if(typeof fetch!=='function'||!/^https?:$/.test(location.protocol))return;
  fetch('feed/feed.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!Array.isArray(j.items))return;let n=0;
    j.items.forEach(r=>{if(!r||!r.id||!r.title||S.items.some(x=>x.id===r.id||(x.url&&x.url===r.url)))return;S.items.push(fromFeed(r));n++});
    if(n){save();render()}
  }).catch(()=>{});
}
loadFeed();try{setInterval(loadFeed,3600e3)}catch(e){}
